<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simon Says Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 1;
            padding: 1rem;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            animation: fadeInDown 0.8s ease-out;
        }

        h2 {
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: 400;
            margin-bottom: 1.5rem;
            opacity: 0.95;
            animation: fadeIn 1s ease-out;
            padding: 0 1rem;
            line-height: 1.5;
        }

        .start-prompt {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            font-weight: 600;
            user-select: none;
        }

        .start-prompt:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .score-display {
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.3rem);
            margin-bottom: 1.5rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .score-display.show {
            opacity: 1;
        }

        .btn-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(0.5rem, 2vw, 1rem);
            width: 100%;
            max-width: 450px;
            padding: 0 1rem;
            perspective: 1000px;
        }

        .btn {
            aspect-ratio: 1;
            width: 100%;
            max-width: 180px;
            justify-self: center;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: clamp(1.5rem, 6vw, 3rem);
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: slideIn 0.6s ease-out backwards;
            touch-action: manipulation;
            user-select: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:nth-child(1) {
            animation-delay: 0.1s;
        }

        .btn:nth-child(2) {
            animation-delay: 0.2s;
        }

        .btn:nth-child(3) {
            animation-delay: 0.3s;
        }

        .btn:nth-child(4) {
            animation-delay: 0.4s;
        }

        .red {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .yellow {
            background: linear-gradient(135deg, #ffd89b 0%, #ff6e7f 100%);
        }

        .green {
            background: linear-gradient(135deg, #a8edea 0%, #5ecc7f 100%);
        }

        .purple {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .flash {
            animation: flashAnim 0.3s ease-in-out;
        }

        .userflash {
            animation: userFlashAnim 0.25s ease-in-out;
        }

        @keyframes flashAnim {
            0%, 100% {
                filter: brightness(1);
                transform: scale(1);
            }
            50% {
                filter: brightness(2.5) saturate(1.8);
                transform: scale(1.15);
                box-shadow: 0 0 50px rgba(255, 255, 255, 0.9),
                            0 15px 50px rgba(0, 0, 0, 0.5);
            }
        }

        @keyframes userFlashAnim {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.6) contrast(1.3);
                transform: scale(1.08);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.95;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) rotateX(-20deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .game-over {
            animation: shake 0.5s ease-in-out;
        }

        .high-score {
            text-align: center;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin-top: 1.5rem;
            opacity: 0.85;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        /* Desktop hover effects (only on devices that support hover) */
        @media (hover: hover) {
            .btn:hover::before {
                left: 100%;
            }

            .btn:hover {
                transform: translateY(-8px) scale(1.05);
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                            inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }

            .start-prompt:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
            }
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .game-container {
                padding: 0.5rem;
                justify-content: center;
                min-height: 100vh;
            }

            h1 {
                margin-bottom: 0.5rem;
            }

            h2 {
                margin-bottom: 1rem;
            }

            .btn-container {
                gap: clamp(0.4rem, 2vw, 0.8rem);
                max-width: 380px;
            }

            .btn {
                border-radius: 15px;
                max-width: 160px;
            }

            .score-display {
                padding: 0.6rem 1.5rem;
                margin-bottom: 1rem;
            }

            .start-prompt {
                padding: 0.8rem 1.5rem;
                margin-bottom: 1rem;
            }
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 0.5rem;
            }

            .btn-container {
                gap: 0.5rem;
                max-width: 320px;
            }

            .btn {
                border-radius: 12px;
                max-width: 140px;
            }

            h2 {
                font-size: clamp(0.9rem, 4vw, 1.2rem);
            }

            .high-score {
                margin-top: 1rem;
                padding: 0.5rem 1rem;
            }
        }

        @media (max-width: 360px) {
            .btn-container {
                max-width: 280px;
            }

            .btn {
                max-width: 120px;
            }
        }

        /* Landscape mode for mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            .game-container {
                padding: 0.5rem;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.3rem;
            }

            h2 {
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }

            .btn-container {
                max-width: 350px;
                gap: 0.5rem;
            }

            .btn {
                max-width: 140px;
            }

            .score-display {
                padding: 0.4rem 1rem;
                margin-bottom: 0.5rem;
                font-size: 0.9rem;
            }

            .start-prompt {
                padding: 0.5rem 1rem;
                margin-bottom: 0.5rem;
                font-size: 0.9rem;
            }

            .high-score {
                margin-top: 0.5rem;
                padding: 0.4rem 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Simon Says</h1>
        <h2 id="instructions">Ready to test your memory?</h2>
        <div class="start-prompt" id="startButton">👆 Tap to Start</div>
        <div class="score-display" id="scoreDisplay">Level: <span id="currentLevel">0</span></div>
        
        <div class="btn-container">
            <div class="btn red" id="red"></div>
            <div class="btn yellow" id="yellow"></div>
            <div class="btn green" id="green"></div>
            <div class="btn purple" id="purple"></div>
        </div>
        
        <div class="high-score" id="highScore">High Score: 0</div>
    </div>

    <script>
        let gameSeq = [];
        let userSeq = [];
        let btns = ["red", "yellow", "green", "purple"];
        let started = false;
        let level = 0;
        let highScore = localStorage.getItem('simonHighScore') || 0;
        let isPlayingSequence = false;

        let h2 = document.querySelector("#instructions");
        let scoreDisplay = document.getElementById('scoreDisplay');
        let currentLevelSpan = document.getElementById('currentLevel');
        let highScoreDisplay = document.getElementById('highScore');
        let startButton = document.getElementById('startButton');
        
        highScoreDisplay.textContent = `High Score: ${highScore}`;

        // Start game function
        function startGame() {
            if (!started) {
                console.log("game started");
                started = true;
                startButton.style.display = 'none';
                scoreDisplay.classList.add('show');
                levelUp();
            }
        }

        // Keyboard support for desktop
        document.addEventListener("keypress", startGame);

        // Touch/click support for mobile and desktop
        startButton.addEventListener("click", startGame);

        function gameFlash(btn) {
            btn.classList.add("flash");
            
            // Haptic feedback for mobile devices
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            
            setTimeout(function () {
                btn.classList.remove("flash");
            }, 300);
        }

        function userFlash(btn) {
            btn.classList.add("userflash");
            
            // Lighter haptic feedback for user input
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
            
            setTimeout(function () {
                btn.classList.remove("userflash");
            }, 250);
        }

        function levelUp() {
            userSeq = [];
            level++;
            currentLevelSpan.textContent = level;
            h2.innerText = `Watch carefully...`;

            let randIdx = Math.floor(Math.random() * 4);
            let randColor = btns[randIdx];
            let randBtn = document.querySelector(`.${randColor}`);
            gameSeq.push(randColor);
            console.log(gameSeq);
            
            // Disable buttons during flash
            isPlayingSequence = true;
            disableButtons();
            
            setTimeout(() => {
                gameFlash(randBtn);
                setTimeout(() => {
                    isPlayingSequence = false;
                    h2.innerText = `Your turn! Level ${level}`;
                    enableButtons();
                }, 400);
            }, 500);
        }

        function checkAns(idx) {
            if (userSeq[idx] === gameSeq[idx]) {
                if (userSeq.length == gameSeq.length) {
                    h2.innerText = `Great! Get ready...`;
                    setTimeout(levelUp, 1000);
                }
            } else {
                // Strong haptic feedback for game over
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
                
                // Update high score
                if (level > highScore) {
                    highScore = level;
                    localStorage.setItem('simonHighScore', highScore);
                    highScoreDisplay.textContent = `High Score: ${highScore} 🎉`;
                    h2.innerHTML = `🎉 New High Score: <b>${level}</b>!`;
                } else {
                    h2.innerHTML = `Game Over! Score: <b>${level}</b>`;
                }
                
                startButton.textContent = '👆 Tap to Restart';
                startButton.style.display = 'block';
                
                document.querySelector(".game-container").classList.add("game-over");
                document.body.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #c92a2a 100%)';
                
                setTimeout(function () {
                    document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    document.querySelector(".game-container").classList.remove("game-over");
                }, 500);
                
                reset();
            }
        }

        function btnPress(e) {
            // Prevent action if sequence is playing
            if (isPlayingSequence || !started) {
                return;
            }
            
            let btn = this;
            userFlash(btn);

            let userColor = btn.getAttribute("id");
            userSeq.push(userColor);

            checkAns(userSeq.length - 1);
        }

        function disableButtons() {
            let allBtns = document.querySelectorAll(".btn");
            allBtns.forEach(btn => {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.7';
            });
        }

        function enableButtons() {
            let allBtns = document.querySelectorAll(".btn");
            allBtns.forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });
        }

        let allBtns = document.querySelectorAll(".btn");
        for (let btn of allBtns) {
            // Use touchstart for immediate response on mobile, click for desktop
            btn.addEventListener("touchstart", function(e) {
                e.preventDefault(); // Prevent double-firing on mobile
                btnPress.call(this, e);
            });
            btn.addEventListener("click", btnPress);
        }

        function reset() {
            started = false;
            gameSeq = [];
            userSeq = [];
            level = 0;
            isPlayingSequence = false;
            currentLevelSpan.textContent = '0';
            scoreDisplay.classList.remove('show');
            enableButtons();
        }

        // Prevent zoom on double tap for iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
